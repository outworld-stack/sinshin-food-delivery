# ═══════════════════════════════════════════════════════════════
# round-49 — sinshin-food-delivery — فایل 5 از 6
# مسیر مقصد: docker-compose.dev.yml
# وضعیت: جایگزینی کامل فایل موجود
# کامیت پیشنهادی: stage forty-three
# ═══════════════════════════════════════════════════════════════

name: sinshin-dev

# ══════════════════════════════════════════════════════════════
# محیط توسعه — برای docker compose نوشته شده (راهنما: README.md — round-28: بازیابی‌شده از stage twenty-one؛ در stage twenty-two به‌اشتباه با نسخه‌ی تولید جایگزین شده بود).
#
#  • نام ایمیج‌های بیرونی بدون پیشوند رجیستری نوشته شده‌اند
#    (پیش‌فرض docker.io) تا میرور تعریف‌شده در daemon.json
#    بدون ابهام اعمال شود.
#
#  • سقف منابع (deploy.resources.limits) فقط در docker-compose.yml اصلی
#    (تولید) تعریف شده — اینجا عمداً نیست: ماشین‌های توسعه
#    متنوع‌اند و سقفِ ثابت بیشتر ضرر می‌زند تا سود.
#
#  • روی ویندوز، حالت پیشنهادی dev روزمره: فقط زیرساخت با این فایل
#    بالا بیاور و اپ‌ها را روی خود سیستم با bun اجرا کن:
#      docker compose -f docker-compose.dev.yml up -d postgres redis
#    (سپس apps/api/.env.local طبق انتهای apps/api/.env.example)
# ══════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: sinshin-dev-postgres
    restart: unless-stopped
    # round-49 — اعتبارنامهٔ ثابت دِو، مستقل از ‎.env ریشه.
    # قبلاً پسورد از ‎.env ریشه خوانده می‌شد ولی DATABASE_URL سرویس‌های
    # api/migrate و apps/api/.env همیشه sinshin_local ثابت بود → با هر
    # پسورد دیگری اتصال می‌شکست. حالت دِو همیشه این سه مقدار است.
    # (اگر volume قدیمی با پسورد دیگری داری: docker compose -f
    #  docker-compose.dev.yml down -v و بالا آوردن دوباره)
    environment:
      POSTGRES_USER: sinshin
      POSTGRES_PASSWORD: sinshin_local
      POSTGRES_DB: sinshin
    volumes:
      - sinshin_dev_pg_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - dev

  redis:
    image: redis:8-alpine
    container_name: sinshin-dev-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - sinshin_dev_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - dev

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    image: sinshin/api:dev
    container_name: sinshin-dev-api

    env_file:
      - .env

    environment:
      APP_ENV: development
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://sinshin:sinshin_local@postgres:5432/sinshin
      REDIS_URL: redis://redis:6379
      SITE_URL: http://localhost:3001
      DEVICE_ENFORCEMENT: ${DEVICE_ENFORCEMENT:-on}
      # round-35 — مترجم آفلاین در همین شبکه‌ی dev
      TRANSLATOR_URL: http://translator:8300

    volumes:
      # Source code: HMR / live reload
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared

      # Node dependencies must stay inside the container (Linux)
      - sinshin_dev_api_node_modules:/app/node_modules
      - sinshin_dev_api_workspace_node_modules:/app/apps/api/node_modules

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    restart: unless-stopped
    init: true
    networks:
      - dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
      # round-49 — کلید نقشهٔ نشان از ‎.env ریشه به بیلد دِو هم می‌رسد
      args:
        VITE_NESHAN_API_KEY: ${VITE_NESHAN_API_KEY:-}
    image: sinshin/web:dev
    container_name: sinshin-dev-web

    environment:
      NODE_ENV: development
      TZ: Asia/Tehran
      PORT: "3000"
      HOST: 0.0.0.0
      API_URL: http://api:3000

    volumes:
      # Source code: HMR / live reload
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared

      # Node dependencies must stay inside the container (Linux)
      - sinshin_dev_web_node_modules:/app/node_modules
      - sinshin_dev_web_workspace_node_modules:/app/apps/web/node_modules

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    restart: unless-stopped
    init: true
    networks:
      - dev

  # Uses the already-built API dev image.
  # No separate API migration image/build is required.
  migrate:
    image: sinshin/api:dev
    container_name: sinshin-dev-migrate

    env_file:
      - .env

    environment:
      APP_ENV: development
      NODE_ENV: development
      DATABASE_URL: postgres://sinshin:sinshin_local@postgres:5432/sinshin
      REDIS_URL: redis://redis:6379

    command:
      - bun
      - src/infra/db/migrate.ts

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"
    networks:
      - dev

  # ═══════════════════════════════════════════════════════════
  # Translator — مترجم آفلاین NLLB-200 (round-35)
  #
  # در dev پورت روی 127.0.0.1 هم باز است تا وقتی API را بیرون از
  # داکر با bun اجرا می‌کنی (TRANSLATOR_URL=http://127.0.0.1:8300)
  # بتوانی از همان ایمیج استفاده کنی.
  # ═══════════════════════════════════════════════════════════

  translator:
    build:
      context: ./services/translator
      dockerfile: Dockerfile

    image: sinshin/translator:dev

    container_name: sinshin-dev-translator

    restart: unless-stopped

    init: true

    ports:
      - "127.0.0.1:8300:8300"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=4)",
        ]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    networks:
      - dev

networks:
  dev:
    name: sinshin-dev-network

volumes:
  sinshin_dev_pg_data:
    name: sinshin_dev_pg_data

  sinshin_dev_redis_data:
    name: sinshin_dev_redis_data

  sinshin_dev_api_node_modules:
    name: sinshin_dev_api_node_modules

  sinshin_dev_api_workspace_node_modules:
    name: sinshin_dev_api_workspace_node_modules

  sinshin_dev_web_node_modules:
    name: sinshin_dev_web_node_modules

  sinshin_dev_web_workspace_node_modules:
    name: sinshin_dev_web_workspace_node_modules