# ═══════════════════════════════════════════════════════════════
# round-50 — sinshin-food-delivery — فایل 6 از 10
# مسیر مقصد: deploy/gitea/runner-config.yaml
# وضعیت: فایل جدید
# کامیت پیشنهادی: stage forty-four
# ═══════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════
# پیکربندی act_runner — رانر CI/CD سین‌شین
#
# مهم‌ترین خط: برچسب deploy:host — یعنی job های «runs-on: deploy»
# مستقیم داخل کانتینر رانر اجرا می‌شوند (بدون کانتینر job جدا)؛
# همان‌جایی که git و docker compose و ‎/opt ماونت است.
#
# capacity=1: استقرارها صف می‌شوند تا دو up هم‌زمان استک را نترکانند.
# timeout: سقف هر job — بیلد با کشِ خالی طولانی است.
# ═══════════════════════════════════════════════════════════════

log:
  level: info

runner:
  # نتیجه‌ی ثبت رانر اینجا ذخیره می‌شود (volume با نام runner_data)
  file: .runner

  # هر بار فقط یک job — استقرارهای پشت‌سرهم صف می‌شوند
  capacity: 1

  # سقف هر job (بیلد اول بدون کش می‌تواند طول بکشد)
  timeout: 60m

  labels:
    - deploy:host

cache:
  # کشِ Actions لازم نیست — workflow ما download/اجرای اکشن بیرونی ندارد
  enabled: false

container:
  network: ""
  valid_volumes: []

host:
  # پوشه‌ی موقتِ فضای کاری job ها — کارِ ما در ‎/opt انجام می‌شود
  workdir_parent:
