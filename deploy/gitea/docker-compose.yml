# ═══════════════════════════════════════════════════════════════
# stage-57 — sinshin-food-delivery — فاز دیپلوی
# مسیر مقصد: deploy/gitea/docker-compose.yml
# وضعیت: جایگزینی کامل فایل موجود (پایه: رارد ۵۰)
# تغییر استیج-۵۷: سقف منابع برای سرور ۸ هسته/۱۶GB + راهنمای
#                  GIT_DOMAIN در ‎.env همین پوشه
# ═══════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════
# round-50 — sinshin-food-delivery — فایل 5 از 10
# مسیر مقصد: deploy/gitea/docker-compose.yml
# وضعیت: فایل جدید
# کامیت پیشنهادی: stage forty-four
# ═══════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════
# استک گیتا + رانر CI/CD — روی خودِ سرور، بدون هیچ سرویس بیرونی.
#
# راه‌اندازی (از ریشه‌ی ریپو):
#   ۱) ‎cp deploy/gitea/.env.example deploy/gitea/.env  ← GIT_DOMAIN بگذار
#   ۲) ‎docker compose -f deploy/gitea/docker-compose.yml up -d gitea
#   ۳) بعد از ساخت ریپو و توکن ثبت رانر (README گام ۴ و ۵):
#      توکن را در ‎.env همین پوشه بگذار و:
#      ‎docker compose -f deploy/gitea/docker-compose.yml up -d
#
# پورت‌ها روی سرور: 127.0.0.1:3000 (رابط وب گیتا — فقط از پشت
# Caddy/HTTPS یا تونل SSH) و 2222 (‏git push با SSH)
# راهنمای کامل: README.md گام ۴، ۵ و ۱۳
# ═══════════════════════════════════════════════════════════════

name: sinshin-gitea

services:

  # ═════════════════════════════════════════════════════════════
  # Gitea — مخزن گیت + رابط وب + اجرای Actions
  # ═════════════════════════════════════════════════════════════

  gitea:
    image: gitea/gitea:1.24

    container_name: sinshin-gitea

    restart: unless-stopped
    init: true

    environment:
      USER_UID: "1000"
      USER_GID: "1000"

      # دیتابیس سبک sqlite — برای گیتای تک‌کاربره کاملاً کافی است
      GITEA__database__DB_TYPE: sqlite3

      # آدرس‌هایی که گیتا در رابط وب برای clone نشان می‌دهد.
      # رارد C3 — HTTPS از پشت Caddy: GIT_DOMAIN از ‎.env همین پوشه
      # خوانده می‌شود و باید همان مقدارِ ‎.env ریشه باشد (README گام ۸).
      GITEA__server__ROOT_URL: https://${GIT_DOMAIN:?GIT_DOMAIN را در deploy/gitea/.env بگذار}/
      GITEA__server__SSH_DOMAIN: ${GIT_DOMAIN:?}
      GITEA__server__SSH_PORT: "2222"

      # Actions (همان CI/CD) روشن
      GITEA__actions__ENABLED: "true"

    volumes:
      - gitea_data:/data

      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    ports:
      # رارد C3 — رابط وب فقط از localhost: از بیرون فقط از پشت
      # Caddy/HTTPS می‌گذرد (اعتبارنامه‌ها دیگر plaintext سفر نمی‌کنند)؛
      # برای راه‌اندازی اولیه از تونل SSH استفاده کن (README گام ۴).
      - "127.0.0.1:3000:3000"

      # git push با SSH
      - "2222:22"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

    networks:
      - edge


  # ═════════════════════════════════════════════════════════════
  # رانر — اجرای workflow استقرار (.gitea/workflows/deploy.yml)
  #
  # حالت host: دستورهای job مستقیم داخل همین کانتینر اجرا
  # می‌شوند؛ برای همین سه چیز به آن وصل است:
  #   • سوکت داکر ← بیلد و بالا آوردن استک اصلی
  #   • ‎/opt/sinshin-food-delivery ← همان کدی که deploy می‌شود
  #     (symlink به SSD — README گام ۶)
  #   • شبکه‌ی host ← دسترسی به گیتا روی localhost:3000
  #
  # تا توکن ثبت در ‎.env گذاشته نشود، فقط ثبت را تلاش می‌کند و
  # استک اصلی دست نمی‌خورد.
  #
  # استیج-۵۷ — نکته: دروازه‌ی کیفیتِ workflow داخل ایمیج
  # oven/bun:1.3.14-slim اجرا می‌شود (docker run) — رانر خودش
  # bun ندارد و لازم هم ندارد؛ همین docker-cli + compose + curl
  # + git کافی است.
  # ═════════════════════════════════════════════════════════════

  runner:
    build:
      context: .
      dockerfile: runner.Dockerfile

    image: sinshin/gitea-runner

    container_name: sinshin-runner

    restart: unless-stopped
    init: true

    network_mode: host

    environment:
      GITEA_INSTANCE_URL: http://localhost:3000

      GITEA_RUNNER_NAME: sinshin-deploy

      # توکن ثبت رانر — از: مدیریت سایت ← Actions ← Runners ← Create Token
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-NOT-SET-YET}

      CONFIG_FILE: /config.yaml

    volumes:
      - ./runner-config.yaml:/config.yaml:ro

      - /var/run/docker.sock:/var/run/docker.sock

      - /opt/sinshin-food-delivery:/opt/sinshin-food-delivery

      - runner_data:/data

    depends_on:
      - gitea

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m


volumes:

  gitea_data:
    name: sinshin_gitea_data

  runner_data:
    name: sinshin_runner_data


networks:

  # همان شبکه‌ی لبه‌ی استک اصلی (sinshin-edge) — اگر نباشد ساخته
  # می‌شود و اگر استک اصلی زودتر بالا آمده باشد همان را استفاده
  # می‌کند. نتیجه: caddy گیتا را همین‌جا با نام «gitea» پیدا
  # می‌کند و HTTPS روی پنل گیتا فعال است (README گام ۱۱).
  edge:
    name: sinshin-edge