<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین هستید | سین‌شین</title>
    <style>
        body {
            font-family: Vazirmatn, Tahoma, sans-serif;

            align-items: center;
            justify-content: center;
            background: #faf7f8;
            color: #1a0a0e;
        }

        .box {
            text-align: center;
            padding: 40px;

        button {
            background: #f6339a;
            color: white;
            border: 0;
            padding: 12px 32px;
            border-radius: 12px;
            font-family: Vazirmatn, Tahoma, sans-serif;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>اتصال اینترنت قطع است</h1>
        <p>برای استفاده از سین‌شین، اتصال خود را بررسی و دوباره تلاش کنید.</p>
        <button onclick="location.reload()">تلاش مجدد</button>

</html>
