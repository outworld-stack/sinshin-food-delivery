<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- رارد ۴۰ — دوزبانه شدن صفحه‌ی آفلاین PWA (آخرین گپ زبان عربی):
         پیش‌فرض فارسی؛ اگر کوکی sinshin-lang=ar باشد، همین اسکریپت ES5
         (قبل از رندر بدنه اجرا می‌شود → بدون فلش) زبان سند را ar می‌کند
         و CSS فقط متن‌های همان زبان را نشان می‌دهد. عنوان هم همان‌جا
         عوض می‌شود. آفلاین یعنی بدون باندل/فونت/JS اپ — همه‌چیز محلی. -->
    <script>
        try {
            if (/(?:^|;\s*)sinshin-lang=ar(?:;|$)/.test(document.cookie)) {
                document.documentElement.lang = 'ar'
                document.title = 'أنت غير متصل | سين شين'
            }
        } catch (e) { }
    </script>
    <title>آفلاین هستید | سین‌شین</title>
    <style>
        body {
            font-family: Vazirmatn, Tahoma, sans-serif;
            direction: rtl;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf7f8;
            color: #1a0a0e;
        }

        .box {
            text-align: center;
            padding: 40px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            color: #d81b72;
            margin: 0 0 8px;
        }

        p {
            font-family: Vazirmatn, Tahoma, sans-serif;
            color: #777;
        }

        button {
            background: #f6339a;
            color: white;
            border: 0;
            padding: 12px 32px;
            border-radius: 12px;
            font-family: Vazirmatn, Tahoma, sans-serif;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* رارد ۴۰ — هر دو زبان در DOM هستند؛ CSS فقط زبانِ فعال را نشان می‌دهد */
        [data-ar] {
            display: none
        }

        html[lang="ar"] [data-fa] {
            display: none
        }

        html[lang="ar"] [data-ar] {
            display: inline
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1><span data-fa>اتصال اینترنت قطع است</span><span data-ar>انقطع الاتصال بالإنترنت</span></h1>
        <p><span data-fa>برای استفاده از سین‌شین، اتصال خود را بررسی و دوباره تلاش کنید.</span><span data-ar>للاستفادة
                من سين شين، يُرجى التحقق من اتصالك والمحاولة من جديد.</span></p>
        <button onclick="location.reload()"><span data-fa>تلاش مجدد</span><span data-ar>إعادة المحاولة</span></button>
    </div>
</body>

</html>
