# ═══════════════════════════════════════════════════════════════
# round-50 — sinshin-food-delivery — فایل 9 از 10
# مسیر مقصد: docker-compose.yml
# وضعیت: جایگزینی کامل فایل موجود
# کامیت پیشنهادی: stage forty-four
# ═══════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════
# round-49 — sinshin-food-delivery — فایل 4 از 6
# مسیر مقصد: docker-compose.yml
# وضعیت: جایگزینی کامل فایل موجود
# کامیت پیشنهادی: stage forty-three
# ═══════════════════════════════════════════════════════════════

name: sinshin

# ══════════════════════════════════════════════════════════════
# استک کامل سین‌شین — برای docker compose نوشته شده.
#
#  • نام ایمیج‌های بیرونی بدون پیشوند رجیستری نوشته شده‌اند
#    (پیش‌فرض docker.io) تا میرور تعریف‌شده در /etc/docker/daemon.json
#    بدون ابهام اعمال شود — راهنمای کامل: README.md
#    (نصب + میرور + چک‌لیست env + دامنه + دستورات روزمره).
#
#  • نام این فایل docker-compose.yml است — همان نام استانداردی که
#    docker compose خودکار پیدا می‌کند؛ دستورهای تولید بدون ‎-f کار
#    می‌کنند (فایل توسعه docker-compose.dev.yml همیشه ‎-f می‌خواهد).
#
#  • سقف منابع هر سرویس با deploy.resources.limits تنظیم شده و
#    docker compose v2 همان‌ها را هنگام up اعمال می‌کند (بدون swarm).
#    کالیبره برای سرور ۴ هسته / ۸GB RAM / ۴۰GB دیسک. اینها سقف‌اند
#    نه رزرو — مصرف عادی خیلی پایین‌تر است؛ هدف فقط است که نشتِ
#    حافظه‌ی یک کانتینر نتواند بقیه‌ی استک و میزبان را بکُشد.
# ══════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════
# Shared API configuration
# ══════════════════════════════════════════════════════════════

x-api-service: &api-service

  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime

  image: sinshin/api

  env_file:
    - .env

  environment:
    APP_ENV: production
    NODE_ENV: production
    PORT: "3000"

    SITE_URL: https://${DOMAIN:-www.sinshin.localhost}

    DEVICE_ENFORCEMENT: ${DEVICE_ENFORCEMENT:-on}

    # round-35 — مترجم آفلاین NLLB (شبکه داخلی؛ پایین بودنش فقط صف ترجمه را نگه می‌دارد)
    TRANSLATOR_URL: ${TRANSLATOR_URL:-http://translator:8300}
    # رارد M15 — همان shared-secret که سرویس translator چک می‌کند
    # (translate-client هدر x-translator-token را می‌فرستد)
    TRANSLATOR_TOKEN: ${TRANSLATOR_TOKEN:-}

  volumes:
    - uploads_data:/data/uploads

  depends_on:
    migrate:
      condition: service_completed_successfully

    redis:
      condition: service_healthy

  healthcheck:
    test:
      [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      ]

    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

  restart: unless-stopped

  init: true

  stop_grace_period: 30s

  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 1g

  networks:
    - edge
    - internal


services:

  # ════════════════════════════════════════════════════════════
  # Caddy / Edge
  # ════════════════════════════════════════════════════════════

  caddy:
    image: caddy:2.10-alpine

    container_name: sinshin-caddy

    restart: unless-stopped
    init: true

    ports:
      - "80:80"
      - "443:443"

    environment:
      DOMAIN: ${DOMAIN:-www.sinshin.localhost}

      # دامنه‌ی بدون پیشوند — سرو ریدایرکت دائمی به دامنه‌ی اصلی
      APEX_DOMAIN: ${APEX_DOMAIN:-sinshin.localhost}

      ACME_EMAIL: ${ACME_EMAIL:-dev@sinshin.localhost}

      # رارد ۵۰ — زیردامنه‌ی اختیاری گیتا؛ فقط وقتی معنا دارد که
      # بلوک کامنت‌شده‌ی انتهای Caddyfile فعال شده باشد (پیش‌فرض
      # بی‌اثر و بی‌ضرر است).
      GIT_DOMAIN: ${GIT_DOMAIN:-git.sinshin.localhost}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      API_UPSTREAMS: ${API_UPSTREAMS:-api:3000}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # Caddy certificates / state.
      - caddy_data:/data

      # Caddy configuration.
      - caddy_config:/config

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

    networks:
      - edge


  # ════════════════════════════════════════════════════════════
  # API — primary instance
  # ════════════════════════════════════════════════════════════

  api:
    <<: *api-service
    container_name: sinshin-api


  # ════════════════════════════════════════════════════════════
  # API — optional replicas
  #
  # Enable with:
  #
  #   API_UPSTREAMS="api:3000 api2:3000 api3:3000"
  #
  #   docker compose --profile scaled up -d
  #
  # All replicas share uploads_data on this host.
  # ════════════════════════════════════════════════════════════

  api2:
    <<: *api-service
    container_name: sinshin-api2

    profiles:
      - scaled


  api3:
    <<: *api-service
    container_name: sinshin-api3

    profiles:
      - scaled


  # ════════════════════════════════════════════════════════════
  # Web / SSR
  # ════════════════════════════════════════════════════════════

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      # round-49 — کلید نقشهٔ نشان برای بیلد وب؛ از ‎.env ریشه می‌آید.
      # Vite متغیرهای VITE_* را موقع build داخل باندل می‌بندد —
      # خالی = فرم مختصات دستی جای نقشه (رفتار قبلی).
      args:
        VITE_NESHAN_API_KEY: ${VITE_NESHAN_API_KEY:-}

    image: sinshin/web

    container_name: sinshin-web

    restart: unless-stopped
    init: true

    stop_grace_period: 30s

    environment:
      NODE_ENV: production
      TZ: Asia/Tehran

      PORT: "3000"
      HOST: 0.0.0.0

      # Internal container network.
      API_URL: http://api:3000

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]

      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 768m

    networks:
      - edge


  # ════════════════════════════════════════════════════════════
  # Database migration
  #
  # One-shot container.
  #
  # It runs before API starts.
  # ════════════════════════════════════════════════════════════

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate

    image: sinshin/api:migrate

    container_name: sinshin-migrate

    env_file:
      - .env

    environment:
      NODE_ENV: production

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

    networks:
      - internal


  # ════════════════════════════════════════════════════════════
  # Database seed
  #
  # Explicit operation only.
  #
  # Run:
  #
  #   docker compose --profile seed run --rm seed
  #
  # NEVER run automatically as part of normal production startup.
  # ════════════════════════════════════════════════════════════

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate

    image: sinshin/api:migrate

    container_name: sinshin-seed

    env_file:
      - .env

    environment:
      NODE_ENV: production

    command:
      - bun
      - drizzle/seed.ts

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: "no"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

    profiles:
      - seed

    networks:
      - internal


  # ════════════════════════════════════════════════════════════
  # PostgreSQL
  # ════════════════════════════════════════════════════════════

  postgres:
    image: postgres:18.6-alpine

    container_name: sinshin-postgres

    restart: unless-stopped
    init: true

    env_file:
      - .env

    command:
      - postgres
      # رارد ۴۵ — تیونینگ پارامتری (پیش‌فرض‌ها = مقادیر قبلی، کالیبره برای
      # سرور ۴ هسته/۸GB)؛ از ‎.env ریشه قابل تغییر — شرح: بند ۴-۲ README
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}

    volumes:
      - pg_data:/var/lib/postgresql

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536m

    networks:
      - internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]

      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  # ════════════════════════════════════════════════════════════
  # Database backup — daily pg_dump with retention
  #
  # Same postgres image as the server → pg_dump is always
  # version-matched and the image is already in local cache
  # (no new download). Fully decoupled from the API: no API
  # crash/restart can ever stop a backup.
  #
  # Schedule/retention via env (see .env.example):
  #   BACKUP_HOUR (default 5) — Tehran time
  #   BACKUP_KEEP (default 7) — versions kept
  #
  # To store backups on the host instead of a named volume,
  # replace the backups_data mount with:
  #   - ./backups:/backups
  # ════════════════════════════════════════════════════════════

  backup:
    image: postgres:18.6-alpine

    container_name: sinshin-backup

    restart: unless-stopped
    init: true

    entrypoint: ["/bin/sh", "/usr/local/bin/sinshin-backup"]

    environment:
      TZ: Asia/Tehran

      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-sinshin}
      PGUSER: ${POSTGRES_USER:-sinshin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      BACKUP_HOUR: ${BACKUP_HOUR:-5}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_DIR: /backups
      # رارد H7 — مقصد offsite (rclone) + کلید عمومی age برای رمزنگاری
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_AGE_PUBKEY: ${BACKUP_AGE_PUBKEY:-}

    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/sinshin-backup:ro
      - backups_data:/backups

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

    networks:
      - internal


  # ════════════════════════════════════════════════════════════
  # Redis
  # ════════════════════════════════════════════════════════════

  redis:
    image: redis:8-alpine

    container_name: sinshin-redis

    restart: unless-stopped
    init: true

    command:
      - redis-server
      - --appendonly
      - "yes"
      # رارد ۴۵ — سقف حافظه‌ی ردیس از ‎.env ریشه (پیش‌فرض همان ۵۱۲ مگابایت قبلی)
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction

    volumes:
      - redis_data:/data

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768m

    networks:
      - internal

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s


  # ════════════════════════════════════════════════════════════
  # Translator — مترجم آفلاین NLLB-200 (round-35)
  #
  # NLLB-200-distilled-600M کوانتیزه‌ی int8 با CTranslate2؛ فقط در
  # شبکه‌ی internal — هیچ پورتی بیرون باز نمی‌کند. API آن را در
  # http://translator:8300 صدا می‌زند (TRANSLATOR_URL). ایمیج
  # دومرحله‌ای است؛ اولین بیلد یک‌بار اینترنت می‌خواهد (دانلود مدل)
  # اما زمان اجرا کاملاً آفلاین است — جزئیات: services/translator/README.md
  #
  # سقف ۲.۵GB: مدل int8 + beam search. جدا از api بلند/پایین می‌شود —
  # وابستگی boot ندارد (صف ترجمه تا برگشتش pending می‌ماند).
  # ════════════════════════════════════════════════════════════

  translator:
    build:
      context: ./services/translator
      dockerfile: Dockerfile

    image: sinshin/translator

    container_name: sinshin-translator

    restart: unless-stopped

    init: true

    # رارد M15 — shared-secret با API: فقط کانتینر api با این توکن
    # می‌تواند /translate را صدا بزند (شبکه‌ی internal + توکن = دو لایه).
    environment:
      TRANSLATOR_TOKEN: ${TRANSLATOR_TOKEN:-}

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2500m

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=4)",
        ]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    networks:
      - internal


# ══════════════════════════════════════════════════════════════
# Persistent storage
# ══════════════════════════════════════════════════════════════

volumes:

  pg_data:
    name: sinshin_pg_data

  backups_data:
    name: sinshin_backups_data

  redis_data:
    name: sinshin_redis_data

  caddy_data:
    name: sinshin_caddy_data

  caddy_config:
    name: sinshin_caddy_config

  uploads_data:
    name: sinshin_uploads_data


# ══════════════════════════════════════════════════════════════
# Networks
# ══════════════════════════════════════════════════════════════

networks:

  edge:
    name: sinshin-edge

  internal:
    name: sinshin-internal
    internal: true